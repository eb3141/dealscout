name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL repo variable is not set. Configure it with: gh variable set APP_URL --body https://<app>.streamlit.app/"
            exit 1
          fi
          # Follow Streamlit's auth-cookie handshake (-L with a cookie jar) so the
          # request actually loads the app and returns HTTP 200, instead of stopping
          # at the initial 303 redirect. -f makes a real 4xx/5xx fail the step.
          curl --retry 3 --retry-delay 10 --retry-all-errors -sSfL \
            -c /tmp/cookies.txt -b /tmp/cookies.txt --max-redirs 10 -o /dev/null \
            -w "HTTP %{http_code}\n" \
            "$APP_URL"
